[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finguard"
version = "0.1.0"
description = "FinGuard backend foundation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "sqlalchemy>=2,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3,<4",
    "uvicorn>=0.30,<1",
    "argon2-cffi>=23,<26",
    "PyJWT>=2.8,<3",
    "confluent-kafka>=2.5,<3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "ruff>=0.7,<1",
]
features = ["redis>=5,<7"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = [
    "integration: requires an explicitly configured PostgreSQL test database",
    "redis_integration: requires an explicitly configured Redis server",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
